name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  NODE_ENV: test
  DATABASE_URL: postgres://anonshare:anonshare_dev@localhost:5432/anonshare_dev
  REDIS_URL: redis://localhost:6379
  STORAGE_ENDPOINT: http://localhost:9000
  STORAGE_ACCESS_KEY_ID: minioadmin
  STORAGE_SECRET_ACCESS_KEY: minioadmin
  STORAGE_BUCKET: anonshare-dev
  STORAGE_REGION: us-east-1
  APP_BASE_URL: http://localhost:3000
  APP_API_URL: http://localhost:3001
  GITHUB_CLIENT_ID: ci-test-client-id
  GITHUB_CLIENT_SECRET: ci-test-client-secret
  GITHUB_ALLOWED_USER_ID: "12345"
  SESSION_SECRET: ci-test-session-secret-min-32-chars-long
  POSTGRES_USER: anonshare
  POSTGRES_PASSWORD: anonshare_dev
  POSTGRES_DB: anonshare_dev
  POSTGRES_PORT: "5432"
  REDIS_PORT: "6379"
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
  MINIO_BUCKET: anonshare-dev
  MINIO_API_PORT: "9000"
  WORKER_HEALTH_PORT: "3002"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anonshare
          POSTGRES_PASSWORD: anonshare_dev
          POSTGRES_DB: anonshare_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anonshare"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify bun.lock is committed
        run: |
          if [ ! -f bun.lock ]; then
            echo "::error::bun.lock is missing from the repository. Run 'bun install' locally and commit the lockfile before merging."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start MinIO
        run: |
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in {1..30}; do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO is ready"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO failed to start" >&2
          docker logs minio || true
          exit 1

      - name: Create MinIO bucket
        run: |
          # Install mc (MinIO client) and create the default bucket
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          mc alias set local http://localhost:9000 minioadmin minioadmin
          mc mb local/anonshare-dev --ignore-existing

      - name: Run workspace verify gate
        run: bun run verify

      - name: Smoke test built health endpoints
        shell: bash
        run: |
          set -euo pipefail

          wait_for_url() {
            local url="$1"

            for _ in {1..30}; do
              if curl -fsS "$url" >/dev/null; then
                return 0
              fi

              sleep 1
            done

            echo "Timed out waiting for $url" >&2
            return 1
          }

          assert_header() {
            local url="$1"
            local header_name="$2"
            local expected_value="$3"
            local actual_value

            actual_value=$(curl -fsS -D - -o /dev/null "$url" \
              | tr -d '\r' \
              | awk -F': ' -v header_name="$(echo "$header_name" | tr '[:upper:]' '[:lower:]')" 'tolower($1) == header_name { print $2 }' \
              | tail -n 1)

            if [ "$actual_value" != "$expected_value" ]; then
              echo "Expected $header_name: $expected_value for $url, got: ${actual_value:-<missing>}" >&2
              return 1
            fi
          }

          bun run --filter '@anonshare/api' start > api.log 2>&1 &
          API_PID=$!
          bun run --filter '@anonshare/web' start > web.log 2>&1 &
          WEB_PID=$!
          bun run --filter '@anonshare/worker' start > worker.log 2>&1 &
          WORKER_PID=$!

          cleanup() {
            status=$?
            kill "$API_PID" "$WEB_PID" "$WORKER_PID" >/dev/null 2>&1 || true
            wait "$API_PID" >/dev/null 2>&1 || true
            wait "$WEB_PID" >/dev/null 2>&1 || true
            wait "$WORKER_PID" >/dev/null 2>&1 || true

            if [ "$status" -ne 0 ]; then
              echo "::group::api.log"
              cat api.log || true
              echo "::endgroup::"
              echo "::group::web.log"
              cat web.log || true
              echo "::endgroup::"
              echo "::group::worker.log"
              cat worker.log || true
              echo "::endgroup::"
            fi

            exit "$status"
          }

          trap cleanup EXIT

          wait_for_url http://localhost:3001/health
          wait_for_url http://localhost:3000/health
          wait_for_url http://localhost:3002/health

          assert_header http://localhost:3001/health x-content-type-options nosniff
          assert_header http://localhost:3001/health referrer-policy strict-origin-when-cross-origin
          assert_header http://localhost:3000/health cache-control no-store
          assert_header http://localhost:3000/health x-content-type-options nosniff
          assert_header http://localhost:3002/health cache-control no-store
          assert_header http://localhost:3002/health x-content-type-options nosniff

  browser-tests:
    name: Browser Tests (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anonshare
          POSTGRES_PASSWORD: anonshare_dev
          POSTGRES_DB: anonshare_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anonshare"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Start MinIO
        run: |
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in {1..30}; do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO is ready"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO failed to start" >&2
          docker logs minio || true
          exit 1

      - name: Create MinIO bucket
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          mc alias set local http://localhost:9000 minioadmin minioadmin
          mc mb local/anonshare-dev --ignore-existing

      - name: Run database migrations
        run: bun run db:migrate

      - name: Start application stack
        shell: bash
        run: |
          bun run --filter '@anonshare/api' start > api.log 2>&1 &
          echo $! > api.pid
          bun run --filter '@anonshare/web' start > web.log 2>&1 &
          echo $! > web.pid
          bun run --filter '@anonshare/worker' start > worker.log 2>&1 &
          echo $! > worker.pid

          for _ in {1..30}; do
            if curl -fsS http://localhost:3001/health >/dev/null && \
               curl -fsS http://localhost:3000/health >/dev/null; then
              echo "Stack is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Stack failed to start" >&2
          cat api.log || true
          cat web.log || true
          exit 1

      - name: Run Playwright browser tests
        run: bun run browser-test
        env:
          NODE_ENV: test
          APP_BASE_URL: http://localhost:3000
          APP_API_URL: http://localhost:3001

      - name: Stop application stack
        if: always()
        run: |
          kill "$(cat api.pid)" "$(cat web.pid)" "$(cat worker.pid)" 2>/dev/null || true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

